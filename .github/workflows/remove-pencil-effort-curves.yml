name: Remove pencil from effort curves
on:
  push:
    paths:
      - '.github/workflows/remove-pencil-effort-curves.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Remove pencil affordance from direct curve selectors
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/activity-interactive-dashboard.tsx')
          s=p.read_text()
          lines=[]
          changed=0
          for line in s.splitlines(True):
              if 'chooseProfile' in line and 'editable-item' in line:
                  new=line.replace(' editable-item','').replace('editable-item ','').replace('editable-item','')
                  if new != line:
                      changed += 1
                      line = new
              lines.append(line)
          if not changed:
              raise SystemExit('no curve selector pencil classes found')
          p.write_text(''.join(lines))
          print(f'updated {changed} curve selector line(s)')
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/activity-interactive-dashboard.tsx
          git commit -m 'fix: keep effort curve selectors clean without pencil icons'
          git push
