name: Upgrade Nexus to v0.3 reviewed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Apply reviewed v0.3
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import zipfile

          payload = """"""
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as z:
              z.extractall(".")
          PY

          cat >> src/app/globals.css <<'CSS'
          /* Nexus v0.3 contextual */
          .context-header{display:flex;gap:6px;overflow:auto;white-space:nowrap}
          .timeline-bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
          .timeline-fill{height:100%;background:var(--primary)}
          .fab{position:fixed;right:max(18px,calc((100vw - 780px)/2 + 18px));bottom:92px;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:white;box-shadow:0 12px 28px rgba(31,91,196,.3);z-index:35}
          CSS

      - name: Resolve dependencies
        run: npm install --no-audit --no-fund

      - name: Production build gate
        run: npm run build

      - name: Clean legacy workflows
        shell: bash
        run: |
          rm -f .github/workflows/bootstrap-nexus.yml
          rm -f .github/workflows/upgrade-nexus-v0.2.yml
          rm -f .github/workflows/fix-nexus-v0.2-build.yml
          rm -f .github/workflows/add-nexus-edit-delete.yml
          rm -f .github/workflows/upgrade-nexus-v0.3-contextual.yml

      - name: Commit only after successful build
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "feat: Nexus v0.3 reviewed contextual portfolio management"
            git push
          fi
