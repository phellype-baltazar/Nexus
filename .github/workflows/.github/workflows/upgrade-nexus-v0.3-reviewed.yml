name: Upgrade Nexus to v0.3 reviewed

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply Nexus v0.3 patch
        shell: bash
        run: |
          python - <<'PY'
          import zipfile

          with zipfile.ZipFile("Nexus_v0_3_REVIEWED_patch.zip") as z:
              z.extractall(".")
          PY

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Remove patch file
        run: rm -f Nexus_v0_3_REVIEWED_patch.zip

      - name: Commit Nexus v0.3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "feat: Nexus v0.3 contextual portfolio management"
            git push
          fi
