name: Add workload reference line
"on":
  push:
    paths:
      - .github/workflows/add-workload-10h-line.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch chart
        shell: python
        run: |
          from pathlib import Path
          p = Path('src/components/activity-interactive-dashboard.tsx')
          s = p.read_text()
          start = '<div style={{height:132,display:"flex",alignItems:"flex-end",gap:1,marginTop:6,borderBottom:"1px solid var(--line)",overflow:"hidden"}}>{workloadCurve.map'
          if start not in s:
              raise SystemExit('chart start not found')
          repl = '<div style={{height:132,position:"relative",marginTop:6,borderBottom:"1px solid var(--line)",overflow:"visible"}}><div style={{position:"absolute",left:0,right:0,top:6,borderTop:"1px dashed #111827",zIndex:3,pointerEvents:"none"}}><span style={{position:"absolute",right:0,top:-16,fontSize:9,fontWeight:800,color:"#111827",background:"white",paddingLeft:4}}>10 h</span></div><div style={{height:"100%",display:"flex",alignItems:"flex-end",gap:1,overflow:"hidden"}}>{workloadCurve.map'
          s = s.replace(start, repl, 1)
          marker = 'marginLeft:firstFuture?2:0}}/>})}</div>\n     <div style={{display:"flex",justifyContent:"space-between"'
          if marker not in s:
              raise SystemExit('chart end not found')
          s = s.replace(marker, 'marginLeft:firstFuture?2:0}}/>})}</div></div>\n     <div style={{display:"flex",justifyContent:"space-between"', 1)
          p.write_text(s)
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/activity-interactive-dashboard.tsx
          git commit -m "feat: add 10h dashed limit line to workload chart"
          git push