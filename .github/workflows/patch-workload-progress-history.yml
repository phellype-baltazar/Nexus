name: Patch workload progress history
on:
  push:
    paths:
      - '.github/workflows/patch-workload-progress-history.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Patch chart scaling
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/activity-interactive-dashboard.tsx')
          s=p.read_text()
          old=''' const futurePeak=Math.max(0,...workloadCurve.filter(x=>x.work_date>=cutoff).map(x=>Number(x.planned_hours||0)));\n const scaleSteps=[1,2,4,6,8,10];\n const chartScale=scaleSteps.find(v=>v>=futurePeak*1.12)??10;'''
          new=''' const curvePeak=Math.max(0,...workloadCurve.map(x=>Number(x.planned_hours||0)));\n const scaleSteps=[1,2,4,6,8,10];\n const chartScale=scaleSteps.find(v=>v>=curvePeak*1.12)??10;'''
          if old not in s:
              raise SystemExit('target block not found')
          s=s.replace(old,new)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/activity-interactive-dashboard.tsx
          git commit -m 'fix: preserve historical workload scale after progress updates'
          git push
