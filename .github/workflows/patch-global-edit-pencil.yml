name: Patch global edit pencil
on:
  push:
    paths:
      - '.github/workflows/patch-global-edit-pencil.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply edit affordance
        run: |
          python - <<'PY'
          from pathlib import Path

          css=Path('src/app/globals.css')
          s=css.read_text()
          block='''\n.editable-item{position:relative!important}\n.editable-item::after{content:"✎";position:absolute;top:8px;right:9px;width:22px;height:22px;border-radius:999px;display:grid;place-items:center;background:#edf3ff;color:var(--primary);font-size:13px;font-weight:900;line-height:1;box-shadow:0 1px 4px rgba(31,91,196,.12);pointer-events:none}\n.editable-item:disabled::after{display:none}\n.editable-item:hover::after,.editable-item:focus-visible::after{background:var(--primary);color:#fff}\n'''
          if '.editable-item::after' not in s:
              s += block
          css.write_text(s)

          p=Path('src/components/project-live-editors.tsx')
          s=p.read_text()
          s=s.replace('className="row" key={r.id} onClick={()=>setEdit({...r})}', 'className="row editable-item" key={r.id} onClick={()=>setEdit({...r})}')
          s=s.replace('className="row" key={k.id} onClick={()=>setEdit({...k})}', 'className="row editable-item" key={k.id} onClick={()=>setEdit({...k})}')
          s=s.replace('className="card" key={s.key} onClick={()=>setEdit({kind:"standard",...s,amount:Number(budget?.[s.key]||0)})}', 'className="card editable-item" key={s.key} onClick={()=>setEdit({kind:"standard",...s,amount:Number(budget?.[s.key]||0)})}')
          s=s.replace('className="card" key={item.id} onClick={()=>setEdit({kind:"custom",...item})}', 'className="card editable-item" key={item.id} onClick={()=>setEdit({kind:"custom",...item})}')
          p.write_text(s)

          p=Path('src/components/activity-interactive-dashboard.tsx')
          s=p.read_text()
          s=s.replace('<button className="card" onClick={()=>{setProgressValue', '<button className="card editable-item" onClick={()=>{setProgressValue')
          s=s.replace('<button className="card" onClick={()=>setEditor("status")}', '<button className="card editable-item" onClick={()=>setEditor("status")}')
          s=s.replace('<button className="card" onClick={()=>setEditor("owner")}', '<button className="card editable-item" onClick={()=>setEditor("owner")}')
          s=s.replace('<button className="chip" onClick={()=>{setForecastValue', '<button className="chip editable-item" onClick={()=>{setForecastValue')
          s=s.replace('<button disabled={terminal} onClick={()=>{setRemainingValue', '<button className="editable-item" disabled={terminal} onClick={()=>{setRemainingValue')
          s=s.replace('<button disabled={terminal} onClick={()=>{setForecastValue', '<button className="editable-item" disabled={terminal} onClick={()=>{setForecastValue')
          s=s.replace('return <button key={x.key} disabled={busy||terminal}', 'return <button className="editable-item" key={x.key} disabled={busy||terminal}')
          s=s.replace('className={`btn ${timing==="early"?"btn-primary":"btn-outline"}`}', 'className={`btn editable-item ${timing==="early"?"btn-primary":"btn-outline"}`}')
          s=s.replace('className={`btn ${timing==="late"?"btn-primary":"btn-outline"}`}', 'className={`btn editable-item ${timing==="late"?"btn-primary":"btn-outline"}`}')
          p.write_text(s)

          p=Path('src/components/entity-actions.tsx')
          s=p.read_text().replace('>Editar</button>', '>✎ Editar</button>')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app/globals.css src/components/project-live-editors.tsx src/components/activity-interactive-dashboard.tsx src/components/entity-actions.tsx
          git commit -m 'feat: standardize edit pencil affordance across live editors'
          git push
