name: Refine workload edit affordance
on:
  push:
    paths:
      - '.github/workflows/refine-workload-edit-affordance.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Refine workload edit affordance
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/components/activity-interactive-dashboard.tsx')
          s=p.read_text()
          s=s.replace('className="chip editable-item" onClick={()=>{setForecastValue', 'className="chip" onClick={()=>{setForecastValue')
          s=s.replace('className="editable-item" disabled={terminal} onClick={()=>{setRemainingValue', 'disabled={terminal} onClick={()=>{setRemainingValue')
          s=s.replace('className="editable-item" disabled={terminal} onClick={()=>{setForecastValue', 'disabled={terminal} onClick={()=>{setForecastValue')
          s=s.replace('>Previsão {dateBR(forecastEnd)}</button>', '>Previsão {dateBR(forecastEnd)} · Editar</button>')
          s=s.replace('<div className="muted" style={{fontSize:9}}>toque para revisar</div></button>', '<div style={{fontSize:9,color:"var(--primary)",fontWeight:800,marginTop:2}}>TOQUE PARA EDITAR</div></button>', 2)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/activity-interactive-dashboard.tsx
          git commit -m 'fix: use clear text affordance on workload edit controls'
          git push
